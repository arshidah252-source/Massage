<!DOCTYPE html>
<html>
<head>
    <title>Messenger</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { 
            background: #ffe6e6; 
            color: #b3002d; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
        }
        .page { 
            display: none; 
            flex: 1; 
            padding: 16px; 
            overflow-y: auto; 
        }
        .page.active { 
            display: flex; 
            flex-direction: column; 
        }
        input, button { 
            padding: 8px; 
            border-radius: 8px; 
            border: none; 
        }
        button { 
            background: #ff0066; 
            color: #fff; 
            cursor: pointer; 
        }
        .message { 
            background: #ffcccc; 
            padding: 6px; 
            margin: 4px 0; 
            border-radius: 6px; 
        }
        .me { 
            background: #ff4d4d; 
            color: #fff; 
            text-align: right; 
        }
        .bottom-nav { 
            display: flex; 
            justify-content: space-around; 
            background: #ff4d4d; 
            padding: 10px; 
            flex-shrink: 0; 
        }
        .bottom-nav button { 
            background: none; 
            color: #fff; 
            border: none; 
            font-size: 14px; 
        }
        .bottom-nav button.active { 
            border-bottom: 2px solid #fff; 
        }
        .input-area {
            display: flex;
            gap: 8px;
            padding: 8px 0;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            background: #ffcccc;
            color: #b3002d;
        }
        #chatMessages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 8px;
        }
        .chat-item {
            background: #ffcccc;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
        }
        .chat-item:hover {
            background: #ffb3b3;
        }
        .auth-box {
            max-width: 300px;
            margin: auto;
            text-align: center;
            padding: 20px;
        }
        .auth-box input {
            width: 100%;
            margin: 6px 0;
            background: #ffcccc;
            color: #b3002d;
        }
        .auth-box button {
            width: 100%;
            margin: 6px 0;
        }
        .profile-info {
            text-align: center;
            padding: 20px 0;
        }
        .profile-info .avatar {
            font-size: 60px;
        }
    </style>
</head>
<body>

    <!-- AUTH PAGE -->
    <div id="authPage" class="page active">
        <div class="auth-box">
            <h2>🐱 Messenger</h2>
            <input type="text" id="authUsername" placeholder="Username...">
            <button onclick="register()">Register</button>
            <button onclick="login()" style="background:#800020;">Login</button>
        </div>
    </div>

    <!-- APP -->
    <div id="appPage" style="display:none; flex-direction:column; height:100vh;">
        
        <!-- CHATS PAGE -->
        <div id="chatsPage" class="page active">
            <h2>💬 Chats</h2>
            <div id="chatList"></div>
        </div>

        <!-- CHAT PAGE -->
        <div id="chatPage" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <button onclick="backToChats()" style="background:#800020;">← Back</button>
                <span id="chatTitle" style="font-weight:bold;">General</span>
            </div>
            <div id="chatMessages"></div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Type...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- PROFILE PAGE -->
        <div id="profilePage" class="page">
            <div class="profile-info">
                <div class="avatar">🐱</div>
                <h2 id="profileName">User</h2>
                <p style="color:#800020;">Member since 2024</p>
                <button onclick="logout()" style="background:#800020; margin-top:12px;">Logout</button>
            </div>
        </div>

        <!-- BOTTOM NAV -->
        <div class="bottom-nav">
            <button class="active" onclick="showPage('chatsPage')">💬 Chats</button>
            <button onclick="showPage('profilePage')">👤 Profile</button>
        </div>
    </div>

    <script>
        var BIN_ID = '6a790240f5f4af5e29000367';
        var API_KEY = '$2a$10$YJqHMZfdvZ/oBZOz6EoWgexdGklYtIB8Hf2VhmRSujXeWTo4xnGfG';

        var currentUser = localStorage.getItem('currentUser') || null;
        var users = [];
        var messages = [];
        var currentChat = 'General';

        function loadData(callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.jsonbin.io/v3/b/' + BIN_ID, true);
            xhr.setRequestHeader('X-Access-Key', API_KEY);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    users = data.record.users || [];
                    messages = data.record.messages || [];
                    if (callback) callback();
                }
            };
            xhr.send();
        }

        function saveData(callback) {
            var data = JSON.stringify({ users: users, messages: messages });
            var xhr = new XMLHttpRequest();
            xhr.open('PUT', 'https://api.jsonbin.io/v3/b/' + BIN_ID, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('X-Access-Key', API_KEY);
            xhr.onload = function() {
                if (callback) callback();
            };
            xhr.send(data);
        }

        function register() {
            var username = document.getElementById('authUsername').value.trim();
            if (!username) return alert('Enter a username');
            loadData(function() {
                if (users.indexOf(username) !== -1) return alert('Username taken');
                users.push(username);
                saveData(function() {
                    currentUser = username;
                    localStorage.setItem('currentUser', username);
                    showApp();
                });
            });
        }

        function login() {
            var username = document.getElementById('authUsername').value.trim();
            if (!username) return alert('Enter your username');
            loadData(function() {
                if (users.indexOf(username) === -1) return alert('User not found');
                currentUser = username;
                localStorage.setItem('currentUser', username);
                showApp();
            });
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('authPage').style.display = 'block';
            document.getElementById('authPage').classList.add('active');
        }

        function showApp() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'flex';
            document.getElementById('profileName').textContent = currentUser;
            renderChatList();
        }

        function renderChatList() {
            var container = document.getElementById('chatList');
            container.innerHTML = '';
            var div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = '📢 General';
            div.onclick = function() { openChat('General'); };
            container.appendChild(div);
        }

        function openChat(name) {
            currentChat = name;
            document.getElementById('chatTitle').textContent = name;
            document.getElementById('chatsPage').classList.remove('active');
            document.getElementById('chatPage').classList.add('active');
            renderMessages();
        }

        function renderMessages() {
            var container = document.getElementById('chatMessages');
            container.innerHTML = '';
            loadData(function() {
                var chatMessages = [];
                for (var i = 0; i < messages.length; i++) {
                    if (messages[i].chat === currentChat) {
                        chatMessages.push(messages[i]);
                    }
                }
                for (var j = 0; j < chatMessages.length; j++) {
                    var m = chatMessages[j];
                    var div = document.createElement('div');
                    div.className = 'message';
                    if (m.user === currentUser) {
                        div.className += ' me';
                    }
                    div.textContent = m.user + ': ' + m.text + ' (' + m.time + ')';
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;
            loadData(function() {
                var newMsg = {
                    chat: currentChat,
                    user: currentUser,
                    text: text,
                    time: new Date().toLocaleTimeString()
                };
                messages.push(newMsg);
                saveData(function() {
                    input.value = '';
                    renderMessages();
                });
            });
        }

        function backToChats() {
            document.getElementById('chatsPage').classList.add('active');
            document.getElementById('chatPage').classList.remove('active');
        }

        function showPage(pageId) {
            var pages = document.querySelectorAll('.page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            document.getElementById(pageId).classList.add('active');
        }

        loadData(function() {
            if (localStorage.getItem('currentUser')) {
                var user = localStorage.getItem('currentUser');
                if (users.indexOf(user) !== -1) {
                    currentUser = user;
                    showApp();
                }
            }
        });
    </script>
</body>
</html>
