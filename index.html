<!DOCTYPE html>
<html>
<head>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Messenger">
    <link rel="apple-touch-icon" sizes="192x192" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
    
    <title>Messenger</title>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #ffe6e6; color: #b3002d; height: 100vh; display: flex; flex-direction: column; }
        .page { display: none; flex: 1; padding: 16px; overflow-y: auto; }
        .page.active { display: flex; flex-direction: column; }
        input, button { padding: 8px; border-radius: 8px; border: none; }
        button { background: #ff0066; color: #fff; cursor: pointer; }
        .message { background: #ffcccc; padding: 6px; margin: 4px 0; border-radius: 6px; }
        .me { background: #ff4d4d; color: #fff; text-align: right; }
        .bottom-nav { display: flex; justify-content: space-around; background: #ff4d4d; padding: 10px; flex-shrink: 0; }
        .bottom-nav button { background: none; color: #fff; border: none; font-size: 14px; }
        .bottom-nav button.active { border-bottom: 2px solid #fff; }
        .input-area { display: flex; gap: 8px; padding: 8px 0; flex-shrink: 0; }
        .input-area input { flex: 1; background: #ffcccc; color: #b3002d; }
        #chatMessages { flex: 1; overflow-y: auto; margin-bottom: 8px; }
        .chat-item { background: #ffcccc; padding: 12px; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .chat-item:hover { background: #ffb3b3; }
        .auth-box { max-width: 300px; margin: auto; text-align: center; padding: 20px; }
        .auth-box input { width: 100%; margin: 6px 0; background: #ffcccc; color: #b3002d; }
        .auth-box button { width: 100%; margin: 6px 0; }
    </style>
</head>
<body>

    <div id="authPage" class="page active">
        <div class="auth-box">
            <h2>🐱 Messenger</h2>
            <input type="text" id="authUsername" placeholder="Username...">
            <button onclick="register()">Register</button>
            <button onclick="login()" style="background:#800020;">Login</button>
        </div>
    </div>

    <div id="appPage" style="display:none; flex-direction:column; height:100vh;">
        <div id="chatsPage" class="page active">
            <h2>💬 Chats</h2>
            <div id="chatList"></div>
        </div>

        <div id="chatPage" class="page">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                <button onclick="backToChats()" style="background:#800020;">← Back</button>
                <span id="chatTitle" style="font-weight:bold;">General</span>
            </div>
            <div id="chatMessages"></div>
            <div class="input-area">
                <input type="text" id="chatInput" placeholder="Type...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="active" onclick="showPage('chatsPage')">💬 Chats</button>
            <button onclick="logout()">🚪 Logout</button>
        </div>
    </div>

    <script>
        var BIN_ID = '6a790240f5f4af5e29000367';
        var API_KEY = '$2a$10$YJqHMZfdvZ/oBZOz6EoWgexdGklYtIB8Hf2VhmRSujXeWTo4xnGfG';

        var currentUser = localStorage.getItem('currentUser') || null;
        var users = [];
        var messages = [];
        var currentChat = 'General';

        function loadData(callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', 'https://api.jsonbin.io/v3/b/' + BIN_ID, true);
            xhr.setRequestHeader('X-Access-Key', API_KEY);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var data = JSON.parse(xhr.responseText);
                    users = data.record.users || [];
                    messages = data.record.messages || [];
                    if (callback) callback();
                }
            };
            xhr.send();
        }

        function saveData(callback) {
            var data = JSON.stringify({ users: users, messages: messages });
            var xhr = new XMLHttpRequest();
            xhr.open('PUT', 'https://api.jsonbin.io/v3/b/' + BIN_ID, true);
            xhr.setRequestHeader('Content-Type', 'application/json');
            xhr.setRequestHeader('X-Access-Key', API_KEY);
            xhr.onload = function() {
                if (callback) callback();
            };
            xhr.send(data);
        }

        function register() {
            var username = document.getElementById('authUsername').value.trim();
            if (!username) return alert('Enter a username');
            loadData(function() {
                if (users.indexOf(username) !== -1) return alert('Username taken');
                users.push(username);
                saveData(function() {
                    currentUser = username;
                    localStorage.setItem('currentUser', username);
                    showApp();
                });
            });
        }

        function login() {
            var username = document.getElementById('authUsername').value.trim();
            if (!username) return alert('Enter your username');
            loadData(function() {
                if (users.indexOf(username) === -1) return alert('User not found');
                currentUser = username;
                localStorage.setItem('currentUser', username);
                showApp();
            });
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('appPage').style.display = 'none';
            document.getElementById('authPage').style.display = 'block';
            document.getElementById('authPage').classList.add('active');
        }

        function showApp() {
            document.getElementById('authPage').style.display = 'none';
            document.getElementById('appPage').style.display = 'flex';
            renderChatList();
        }

        function renderChatList() {
            document.getElementById('chatList').innerHTML = '<div class="chat-item" onclick="openChat(\'General\')">📢 General</div>';
        }

        function openChat(name) {
            currentChat = name;
            document.getElementById('chatTitle').textContent = name;
            document.getElementById('chatsPage').classList.remove('active');
            document.getElementById('chatPage').classList.add('active');
            renderMessages();
        }

        function renderMessages() {
            var container = document.getElementById('chatMessages');
            container.innerHTML = '';
            loadData(function() {
                var chatMessages = messages.filter(function(m) { return m.chat === currentChat; });
                for (var i = 0; i < chatMessages.length; i++) {
                    var m = chatMessages[i];
                    var div = document.createElement('div');
                    div.className = 'message' + (m.user === currentUser ? ' me' : '');
                    div.textContent = m.user + ': ' + m.text + ' (' + m.time + ')';
                    container.appendChild(div);
                }
                container.scrollTop = container.scrollHeight;
            });
        }

        function sendMessage() {
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;
            loadData(function() {
                messages.push({
                    chat: currentChat,
                    user: currentUser,
                    text: text,
                    time: new Date().toLocaleTimeString()
                });
                saveData(function() {
                    input.value = '';
                    renderMessages();
                });
            });
        }

        function backToChats() {
            document.getElementById('chatsPage').classList.add('active');
            document.getElementById('chatPage').classList.remove('active');
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
            document.getElementById(pageId).classList.add('active');
        }

        loadData(function() {
            if (localStorage.getItem('currentUser')) {
                var user = localStorage.getItem('currentUser');
                if (users.indexOf(user) !== -1) {
                    currentUser = user;
                    showApp();
                }
            }
        });
    </script>
</body>
                </html>
